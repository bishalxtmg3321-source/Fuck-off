<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5ff;
      text-align: center;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 30px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 35px;
    }

    .card {
      background: white;
      margin: 40px 20px;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .button {
      display: inline-block;
      background: #4f46e5;
      color: white;
      padding: 14px 25px;
      border-radius: 30px;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    #game {
      display: none;
      position: relative;
      height: 400px;
      margin: 20px;
      background: #dbeafe;
      border-radius: 20px;
      overflow: hidden;
    }

    #coin {
      position: absolute;
      font-size: 45px;
      cursor: pointer;
      display: none;
    }

    #score {
      font-size: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>My Website 🚀</h1>
    <p>Welcome to my first website!</p>
  </div>

  <div class="card" id="welcome">
    <h2>Hello! 👋</h2>

    <p>
      Welcome to my website.
      Ready to play?
    </p>

    <button class="button" onclick="startGame()">
      🎮 Click Me
    </button>
  </div>

  <div id="game">
    <div id="score">Score: 0</div>
    <div id="coin" onclick="collectCoin()">🪙</div>
  </div>

  <footer>
    © 2026 My Website
  </footer>

  <script>
    let score = 0;

    function startGame() {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("game").style.display = "block";

      score = 0;
      document.getElementById("score").innerText = "Score: 0";

      moveCoin();
    }

    function collectCoin() {
      score++;
      document.getElementById("score").innerText =
        "Score: " + score;

      moveCoin();
    }

    function moveCoin() {
      const game = document.getElementById("game");
      const coin = document.getElementById("coin");

      coin.style.display = "block";

      const x = Math.random() * (game.clientWidth - 60);
      const y = 60 + Math.random() * (game.clientHeight - 110);

      coin.style.left = x + "px";
      coin.style.top = y + "px";
    }
  </script>

</body>
</html>
